<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Машині задачі</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg1:#f0e8ff;--bg2:#fce4ec;--bg3:#e8f4fd;
  --glass:rgba(255,255,255,0.52);
  --glass2:rgba(255,255,255,0.72);
  --glass-border:rgba(255,255,255,0.82);
  --shadow:0 8px 32px rgba(120,80,180,0.10);
  --text:#2d2346;--text2:#7b6fa0;--text3:#b0a8c8;
  --accent:#8b5cf6;--accent2:#ec4899;
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);min-height:100vh;color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;top:-120px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-100px;left:-60px;width:350px;height:350px;background:radial-gradient(circle,rgba(236,72,153,0.14) 0%,transparent 70%);pointer-events:none;z-index:0}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.glass2{background:var(--glass2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);box-shadow:var(--shadow)}

.topbar{position:sticky;top:0;z-index:200;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.7)}
.logo{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon i{color:#fff;font-size:15px;-webkit-text-fill-color:#fff}
.view-tabs{display:flex;gap:2px;background:rgba(255,255,255,0.5);border-radius:10px;padding:3px;border:1px solid rgba(255,255,255,0.7)}
.vtab{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:12px;font-family:'Manrope',sans-serif;font-weight:600;cursor:pointer;color:var(--text2);transition:all .2s}
.vtab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(139,92,246,0.15)}

.page{display:flex;gap:16px;max-width:1200px;margin:0 auto;padding:20px 16px;position:relative;z-index:1;align-items:flex-start}

/* SIDEBAR */
.quick-sidebar{width:220px;flex-shrink:0;position:sticky;top:74px}
.qs-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.qs-add-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.qs-inp{background:rgba(255,255,255,0.65);border:1px solid rgba(255,255,255,0.85);border-radius:10px;padding:9px 12px;font-size:12px;font-family:'Manrope',sans-serif;color:var(--text);outline:none;width:100%;transition:all .2s}
.qs-inp:focus{background:#fff;border-color:rgba(139,92,246,0.4);box-shadow:0 0 0 3px rgba(139,92,246,0.08)}
.qs-inp::placeholder{color:var(--text3)}
.btn-qs-add{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;gap:4px;width:100%}
.btn-qs-add:hover{opacity:.9}
.qs-list{display:flex;flex-direction:column;gap:6px}
.qs-chip{background:rgba(255,255,255,0.68);border:1px solid rgba(255,255,255,0.88);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:500;color:var(--text);cursor:grab;display:flex;align-items:center;gap:6px;transition:all .2s;user-select:none;line-height:1.3}
.qs-chip:hover{background:#fff;box-shadow:0 4px 12px rgba(139,92,246,0.13);transform:translateX(2px)}
.qs-chip.dragging{opacity:0.45;transform:scale(0.95)}
.qs-grip{color:var(--text3);font-size:12px;flex-shrink:0}
.qs-text{flex:1;min-width:0;word-break:break-word}
.qs-del{color:var(--text3);font-size:11px;cursor:pointer;flex-shrink:0;transition:color .15s}
.qs-del:hover{color:var(--accent2)}
.qs-hint{font-size:10px;color:var(--text3);margin-top:10px;text-align:center;line-height:1.5;padding:0 4px}

.main-content{flex:1;min-width:0}
.nav-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.nav-btn{background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.8);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px;transition:all .2s;flex-shrink:0}
.nav-btn:hover{background:#fff;color:var(--accent)}
.nav-label{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;color:var(--text);flex:1;text-align:center;letter-spacing:-0.02em}

.progress-card{border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.prog-label{font-size:12px;color:var(--text2);font-weight:500}
.prog-pct{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.bar-bg{height:8px;background:rgba(139,92,246,0.12);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.4,0,.2,1)}

.add-card{border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.field-lbl{font-size:11px;color:var(--text2);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.field-row{display:flex;gap:8px;margin-bottom:10px}
.field-row input{flex:1}
.field-grid-day{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:10px}
input[type=text],input[type=number],select,textarea{font-family:'Manrope',sans-serif;font-size:13px;color:var(--text);background:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.85);border-radius:10px;padding:9px 12px;outline:none;width:100%;transition:all .2s}
input:focus,select:focus,textarea:focus{background:#fff;border-color:rgba(139,92,246,0.4);box-shadow:0 0 0 3px rgba(139,92,246,0.08)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:none;height:52px;margin-bottom:10px}
input[type=number]{text-align:center}
.btn-add{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add:hover{opacity:.9}
.sec-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:5px}

/* TASK CARD */
.task-card{background:rgba(255,255,255,0.62);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.85);border-radius:14px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px;transition:all .2s}
.task-card:hover{background:rgba(255,255,255,0.82);box-shadow:0 4px 16px rgba(139,92,246,0.1);transform:translateY(-1px)}
.task-card.done-card{opacity:.55}
.pri-dot{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:18px;margin-top:2px}
.chk{width:18px;height:18px;border-radius:5px;border:2px solid rgba(139,92,246,0.3);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.chk:hover{border-color:var(--accent)}
.chk.done{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.task-body{flex:1;min-width:0}
.task-main{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px}
.task-txt{font-size:13px;font-weight:600;color:var(--text)}
.task-txt.done{text-decoration:line-through;color:var(--text3);font-weight:400}
.badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600}
.cat-best{background:rgba(59,130,246,0.12);color:#2563eb}
.cat-allm{background:rgba(139,92,246,0.12);color:#7c3aed}
.cat-pers{background:rgba(236,72,153,0.12);color:#be185d}
.cat-study{background:rgba(249,115,22,0.12);color:#c2410c}
.cat-other{background:rgba(148,163,184,0.15);color:#64748b}
.pri-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(139,92,246,0.08);color:var(--accent);font-weight:700}
.task-note{font-size:11px;color:var(--text2);margin-top:2px}
.task-actions{display:flex;gap:2px;flex-shrink:0}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--text3);padding:3px;border-radius:6px;font-size:14px;transition:all .15s;display:flex;align-items:center}
.btn-icon:hover{background:rgba(139,92,246,0.1);color:var(--accent)}
.btn-icon.del:hover{background:rgba(239,68,68,0.1);color:#ef4444}

/* KANBAN */
.week-kanban{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.kanban-col{border-radius:var(--radius);padding:10px 8px;min-height:180px;transition:all .2s}
.kanban-col.drop-target{background:rgba(139,92,246,0.08)!important;border-color:var(--accent)!important}
.kanban-col-header{margin-bottom:8px;text-align:center}
.kcol-day{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.kcol-num{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;color:var(--text);line-height:1;margin-bottom:4px}
.kanban-col.is-today .kcol-num{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.kcol-add-btn{width:100%;background:rgba(139,92,246,0.07);border:1px dashed rgba(139,92,246,0.25);border-radius:10px;padding:6px;font-size:11px;color:var(--text2);cursor:pointer;text-align:center;transition:all .2s;font-family:'Manrope',sans-serif;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:3px}
.kcol-add-btn:hover{background:rgba(139,92,246,0.12);border-color:var(--accent);color:var(--accent)}
.kanban-task{background:rgba(255,255,255,0.68);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.9);border-radius:10px;padding:8px 10px;margin-bottom:5px;cursor:grab;transition:all .2s;position:relative}
.kanban-task:hover{background:#fff;box-shadow:0 4px 12px rgba(139,92,246,0.12);transform:translateY(-1px)}
.kanban-task.dragging{opacity:0.4;transform:scale(0.95)}
.kanban-task.done-card{opacity:.5}
.kt-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3;padding-right:16px}
.kt-name.done{text-decoration:line-through;color:var(--text3);font-weight:400}
.kt-meta{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.kt-chk{width:14px;height:14px;border-radius:4px;border:1.5px solid rgba(139,92,246,0.3);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.kt-chk.done{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.kt-btns{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.kanban-task:hover .kt-btns{opacity:1}
.kt-btn{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:2px;border-radius:4px;transition:all .15s}
.kt-btn:hover{color:var(--accent)}
.kt-btn.del:hover{color:#ef4444}

/* INLINE ADD IN KANBAN - full form */
.kcol-form{background:rgba(255,255,255,0.85);border-radius:10px;padding:8px;margin-top:4px}
.kcol-form input,.kcol-form select{font-size:11px;padding:5px 8px;border-radius:7px;margin-bottom:5px;background:rgba(255,255,255,0.8)}
.kcol-form-grid{display:grid;grid-template-columns:1fr 42px;gap:4px;margin-bottom:5px}
.kcol-inline-btns{display:flex;gap:4px}
.kcol-ok{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:7px;padding:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Manrope',sans-serif}
.kcol-cancel{background:rgba(0,0,0,0.05);color:var(--text2);border:none;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer;font-family:'Manrope',sans-serif}

/* MONTH */
.month-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.mhdr{font-size:10px;color:var(--text2);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mday{background:rgba(255,255,255,0.42);border:1px solid rgba(255,255,255,0.7);border-radius:10px;padding:5px;min-height:48px}
.mday.is-today{background:rgba(139,92,246,0.07);border-color:rgba(139,92,246,0.35)}
.mday.other-month{opacity:.3}
.md-num{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px}
.mday.is-today .md-num{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.md-dots{display:flex;flex-wrap:wrap;gap:2px}
.dot{width:5px;height:5px;border-radius:50%}

.day-group{margin-bottom:16px}
.dg-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dg-date{font-size:12px;font-weight:700;color:var(--text)}
.dg-date.is-today{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dg-cnt{font-size:10px;color:var(--text2);background:rgba(139,92,246,0.08);padding:2px 8px;border-radius:99px}
.dg-line{flex:1;height:1px;background:rgba(139,92,246,0.1)}

.empty-state{text-align:center;padding:40px 0;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:10px;opacity:.35}
.empty-state p{font-size:13px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(45,35,70,0.35);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--radius);padding:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(45,35,70,0.2)}
.modal-title{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;transition:color .15s}
.modal-close:hover{color:var(--text)}
.modal input,.modal select,.modal textarea{background:#f7f5ff;border:1px solid rgba(139,92,246,0.15)}
.modal input:focus,.modal select:focus,.modal textarea:focus{background:#fff;border-color:rgba(139,92,246,0.4);box-shadow:0 0 0 3px rgba(139,92,246,0.08)}
.modal-grid{display:grid;grid-template-columns:1fr 80px;gap:10px;margin-bottom:10px}
.btn-save{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;margin-top:4px}
.btn-save:hover{opacity:.9}

select option{background:#fff;color:var(--text)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-checkbox"></i></div>
    Машині задачі
  </div>
  <div class="view-tabs">
    <button class="vtab active" onclick="setView('day')">День</button>
    <button class="vtab" onclick="setView('week')">Тиждень</button>
    <button class="vtab" onclick="setView('month')">Місяць</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">
      ✏️ Редагувати задачу
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="field-lbl">Назва</div>
    <div class="field-row" style="margin-bottom:10px"><input type="text" id="m-txt" placeholder="Назва задачі..."/></div>
    <div class="modal-grid">
      <div>
        <div class="field-lbl">Категорія</div>
        <select id="m-cat">
          <option value="best">💙 БЕСТ</option>
          <option value="allm">💜 AllMasters</option>
          <option value="pers">🩷 Особисте</option>
          <option value="study">🟠 Навчання</option>
          <option value="other">⚪ Інше</option>
        </select>
      </div>
      <div>
        <div class="field-lbl">Пріоритет</div>
        <input type="number" id="m-pri" min="1" max="10" value="5"/>
      </div>
    </div>
    <div class="field-lbl">Нотатка</div>
    <textarea id="m-note" placeholder="Нотатка..." style="margin-bottom:10px"></textarea>
    <button class="btn-save" onclick="saveEdit()">Зберегти</button>
  </div>
</div>

<div class="page">
  <!-- SIDEBAR -->
  <div class="quick-sidebar">
    <div class="glass2" style="border-radius:var(--radius);padding:14px 12px">
      <div class="qs-title"><i class="ti ti-bolt" style="font-size:13px;color:var(--accent)"></i>Швидкі задачі</div>
      <div class="qs-add-row">
        <input class="qs-inp" type="text" id="quick-inp" placeholder="Нова задача..." onkeydown="if(event.key==='Enter')addQuick()"/>
        <button class="btn-qs-add" onclick="addQuick()"><i class="ti ti-plus" style="font-size:13px"></i>Додати</button>
      </div>
      <div class="qs-list" id="quick-list"></div>
      <div class="qs-hint" id="qs-hint"></div>
    </div>
  </div>

  <div class="main-content">
    <div class="nav-row">
      <button class="nav-btn" onclick="navPrev()"><i class="ti ti-chevron-left"></i></button>
      <span class="nav-label" id="nav-label"></span>
      <button class="nav-btn" onclick="navNext()"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="progress-card glass">
      <div class="progress-top">
        <span class="prog-label" id="prog-lbl">0 з 0 виконано</span>
        <span class="prog-pct" id="prog-pct">0%</span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="bar-fill" style="width:0%"></div></div>
    </div>
    <div id="calendar-view"></div>
    <div id="add-form-area"></div>
    <div id="tasks-area"></div>
  </div>
</div>

<script>
const CAT={
  best:{label:'БЕСТ',cls:'cat-best',color:'#3b82f6'},
  allm:{label:'AllMasters',cls:'cat-allm',color:'#8b5cf6'},
  pers:{label:'Особисте',cls:'cat-pers',color:'#ec4899'},
  study:{label:'Навчання',cls:'cat-study',color:'#f97316'},
  other:{label:'Інше',cls:'cat-other',color:'#94a3b8'}
};
const DAYS=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL=['неділя','понеділок','вівторок','середа','четвер','п\'ятниця','субота'];
const MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MONTHS_S=['Січ','Лют','Бер','Квіт','Трав','Черв','Лип','Серп','Вер','Жовт','Лист','Груд'];

let view='day',cursor=todayD(),allTasks={},quickTasks=[],dragTask=null;
let editKey=null,editId=null;

function todayD(){const d=new Date();d.setHours(0,0,0,0);return d}
function dk(d){return(d instanceof Date?d:new Date(d)).toISOString().slice(0,10)}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function load(){
  try{const s=localStorage.getItem('mytasker_v4');if(s){const p=JSON.parse(s);allTasks=p.tasks||{};quickTasks=p.quick||[];}}
  catch(e){allTasks={};quickTasks=[];}
}
function save(){try{localStorage.setItem('mytasker_v4',JSON.stringify({tasks:allTasks,quick:quickTasks}));}catch(e){}}

function setView(v){
  view=v;
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('active',t.textContent.trim()==={day:'День',week:'Тиждень',month:'Місяць'}[v]));
  render();
}
function navPrev(){
  if(view==='day')cursor=new Date(cursor.getTime()-86400000);
  else if(view==='week')cursor=new Date(cursor.getTime()-7*86400000);
  else cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);
  render();
}
function navNext(){
  if(view==='day')cursor=new Date(cursor.getTime()+86400000);
  else if(view==='week')cursor=new Date(cursor.getTime()+7*86400000);
  else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
  render();
}
function getWeekStart(d){const day=d.getDay();return new Date(d.getTime()-(day===0?6:day-1)*86400000)}
function priColor(p){return p>=8?'#ef4444':p>=5?'#f97316':'#22c55e'}
function getTasksForDate(d){return(allTasks[dk(d)]||[]).map(t=>({...t,_key:dk(d)}))}

function formatNavLabel(){
  if(view==='day'){
    const td=todayD(),diff=(cursor-td)/86400000;
    const base=cursor.getDate()+' '+MONTHS_S[cursor.getMonth()]+' '+cursor.getFullYear();
    if(diff===0)return'Сьогодні, '+base;if(diff===1)return'Завтра, '+base;if(diff===-1)return'Вчора, '+base;
    return DAYS_FULL[cursor.getDay()]+', '+base;
  }
  if(view==='week'){const ws=getWeekStart(cursor),we=new Date(ws.getTime()+6*86400000);return ws.getDate()+' '+MONTHS_S[ws.getMonth()]+' — '+we.getDate()+' '+MONTHS_S[we.getMonth()]+' '+we.getFullYear();}
  return MONTHS[cursor.getMonth()]+' '+cursor.getFullYear();
}

/* QUICK */
function addQuick(){
  const inp=document.getElementById('quick-inp');
  const txt=inp.value.trim();if(!txt)return;
  quickTasks.push({id:Date.now(),text:cap(txt)});
  inp.value='';save();renderQuick();
}
function delQuick(id){quickTasks=quickTasks.filter(q=>q.id!==id);save();renderQuick();}
function renderQuick(){
  const el=document.getElementById('quick-list');
  const hint=document.getElementById('qs-hint');
  if(!quickTasks.length){el.innerHTML='';hint.innerHTML='Тут з\'являться задачі без дати.<br>Перетягни їх на потрібний день 👉';return;}
  hint.innerHTML=view==='week'?'Перетягни на потрібний день 👉':'Перейди у вигляд тижня, щоб перетягувати';
  el.innerHTML=quickTasks.map(q=>`
    <div class="qs-chip" draggable="true" id="qchip-${q.id}"
      ondragstart="onQuickDragStart(event,${q.id})" ondragend="onDragEnd(event)">
      <i class="ti ti-grip-vertical qs-grip"></i>
      <span class="qs-text">${q.text}</span>
      <span class="qs-del" onclick="delQuick(${q.id})"><i class="ti ti-x"></i></span>
    </div>`).join('');
}

/* DRAG */
function onQuickDragStart(e,id){dragTask={type:'quick',id};e.dataTransfer.effectAllowed='move';setTimeout(()=>document.getElementById('qchip-'+id)?.classList.add('dragging'),0);}
function onKanbanDragStart(e,key,id){dragTask={type:'task',key,id};e.dataTransfer.effectAllowed='move';e.currentTarget.classList.add('dragging');}
function onDragEnd(e){document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));dragTask=null;}
function onColDragOver(e,ds){e.preventDefault();document.querySelectorAll('.kanban-col').forEach(c=>c.classList.remove('drop-target'));document.getElementById('kcol-'+ds)?.classList.add('drop-target');}
function onColDrop(e,ds){
  e.preventDefault();if(!dragTask)return;
  if(dragTask.type==='quick'){const q=quickTasks.find(x=>x.id===dragTask.id);if(q){if(!allTasks[ds])allTasks[ds]=[];allTasks[ds].push({id:Date.now(),text:q.text,cat:'other',pri:5,note:'',done:false});quickTasks=quickTasks.filter(x=>x.id!==dragTask.id);}}
  else if(dragTask.type==='task'){const sk=dragTask.key;if(sk===ds){dragTask=null;return;}const t=(allTasks[sk]||[]).find(x=>x.id===dragTask.id);if(t){allTasks[sk]=allTasks[sk].filter(x=>x.id!==dragTask.id);if(!allTasks[ds])allTasks[ds]=[];allTasks[ds].push({id:t.id,text:t.text,cat:t.cat,pri:t.pri,note:t.note,done:t.done});}}
  dragTask=null;save();render();
}

/* CRUD */
function addTaskToDate(ds,txt,cat,pri,note){if(!txt.trim())return;if(!allTasks[ds])allTasks[ds]=[];allTasks[ds].push({id:Date.now(),text:cap(txt),cat,pri,note:note?cap(note):'',done:false});save();render();}
function toggleTask(key,id){const t=(allTasks[key]||[]).find(x=>x.id===id);if(t){t.done=!t.done;save();render();}}
function delTask(key,id){if(!allTasks[key])return;allTasks[key]=allTasks[key].filter(x=>x.id!==id);save();render();}

/* EDIT MODAL */
function openEdit(key,id){
  const t=(allTasks[key]||[]).find(x=>x.id===id);if(!t)return;
  editKey=key;editId=id;
  document.getElementById('m-txt').value=t.text;
  document.getElementById('m-cat').value=t.cat;
  document.getElementById('m-pri').value=t.pri;
  document.getElementById('m-note').value=t.note||'';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>document.getElementById('m-txt').focus(),50);
}
function closeModal(){document.getElementById('modal').style.display='none';editKey=null;editId=null;}
function saveEdit(){
  if(!editKey||!editId)return;
  const t=(allTasks[editKey]||[]).find(x=>x.id===editId);if(!t)return;
  const txt=document.getElementById('m-txt').value.trim();if(!txt)return;
  t.text=cap(txt);
  t.cat=document.getElementById('m-cat').value;
  t.pri=Math.min(10,Math.max(1,parseInt(document.getElementById('m-pri').value)||5));
  t.note=document.getElementById('m-note').value.trim();
  save();closeModal();render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function progressFor(tasks){const total=tasks.length,done=tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0;return{total,done,pct};}
function setProgress({total,done,pct},label){
  document.getElementById('prog-lbl').textContent=done+' з '+total+' '+label;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('bar-fill').style.width=pct+'%';
}

/* TASK CARD */
function taskCardHTML(t){
  return`<div class="task-card${t.done?' done-card':''}">
    <div class="pri-dot" style="background:${priColor(t.pri)};min-height:18px"></div>
    <div class="chk${t.done?' done':''}" onclick="toggleTask('${t._key}',${t.id})" tabindex="0" role="checkbox" aria-checked="${t.done}" onkeydown="if(event.key===' ')toggleTask('${t._key}',${t.id})">
      ${t.done?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':''}
    </div>
    <div class="task-body">
      <div class="task-main">
        <span class="task-txt${t.done?' done':''}">${t.text}</span>
        <span class="badge ${CAT[t.cat]?.cls||'cat-other'}">${CAT[t.cat]?.label||t.cat}</span>
        <span class="pri-badge">★${t.pri}</span>
      </div>
      ${t.note?`<div class="task-note">${t.note}</div>`:''}
    </div>
    <div class="task-actions">
      <button class="btn-icon" onclick="openEdit('${t._key}',${t.id})" title="Редагувати"><i class="ti ti-pencil"></i></button>
      <button class="btn-icon del" onclick="delTask('${t._key}',${t.id})" title="Видалити"><i class="ti ti-trash"></i></button>
    </div>
  </div>`;
}

/* KANBAN TASK */
function kanbanTaskHTML(t){
  return`<div class="kanban-task${t.done?' done-card':''}" draggable="true"
    ondragstart="onKanbanDragStart(event,'${t._key}',${t.id})" ondragend="onDragEnd(event)">
    <div class="kt-btns">
      <button class="kt-btn" onclick="openEdit('${t._key}',${t.id})" title="Редагувати"><i class="ti ti-pencil"></i></button>
      <button class="kt-btn del" onclick="delTask('${t._key}',${t.id})" title="Видалити"><i class="ti ti-x"></i></button>
    </div>
    <div style="display:flex;align-items:flex-start;gap:5px">
      <div class="kt-chk${t.done?' done':''}" onclick="toggleTask('${t._key}',${t.id})">
        ${t.done?'<i class="ti ti-check" style="font-size:9px;color:#fff"></i>':''}
      </div>
      <div style="flex:1;min-width:0">
        <div class="kt-name${t.done?' done':''}">${t.text}</div>
        <div class="kt-meta">
          <span class="badge ${CAT[t.cat]?.cls||'cat-other'}" style="font-size:9px;padding:1px 5px">${CAT[t.cat]?.label||t.cat}</span>
          <span class="pri-badge" style="font-size:9px;padding:1px 5px">★${t.pri}</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* GROUPED */
function groupedHTML(dates){
  const td=todayD();let hasAny=false,html='';
  dates.forEach(d=>{
    const tasks=getTasksForDate(d).sort((a,b)=>b.pri-a.pri);if(!tasks.length)return;hasAny=true;
    const isToday=dk(d)===dk(td),diff=(d-td)/86400000;
    let label=d.getDate()+' '+MONTHS_S[d.getMonth()];
    if(isToday)label='Сьогодні, '+label;else if(diff===1)label='Завтра, '+label;else if(diff===-1)label='Вчора, '+label;else label=cap(DAYS_FULL[d.getDay()])+', '+label;
    const cnt=tasks.length;
    html+=`<div class="day-group"><div class="dg-header"><span class="dg-date${isToday?' is-today':''}">${label}</span><span class="dg-cnt">${cnt} ${cnt===1?'задача':cnt<5?'задачі':'задач'}</span><div class="dg-line"></div></div>${tasks.map(t=>taskCardHTML(t)).join('')}</div>`;
  });
  if(!hasAny)html=`<div class="empty-state"><i class="ti ti-checkbox"></i><p>Задач немає — додай першу!</p></div>`;
  return html;
}

/* KANBAN INLINE ADD - з категорією і пріоритетом */
function showKcolAdd(ds){
  const area=document.getElementById('kcol-add-'+ds);if(!area)return;
  area.innerHTML=`<div class="kcol-form">
    <input type="text" id="ki-${ds}" placeholder="Назва задачі..." onkeydown="if(event.key==='Escape')cancelKcol('${ds}')"/>
    <div class="kcol-form-grid">
      <select id="kc-${ds}">
        <option value="best">💙 БЕСТ</option>
        <option value="allm">💜 AllMasters</option>
        <option value="pers">🩷 Особисте</option>
        <option value="study">🟠 Навчання</option>
        <option value="other" selected>⚪ Інше</option>
      </select>
      <input type="number" id="kp-${ds}" min="1" max="10" value="5" title="Пріоритет"/>
    </div>
    <div class="kcol-inline-btns">
      <button class="kcol-ok" onclick="submitKcol('${ds}')">Додати</button>
      <button class="kcol-cancel" onclick="cancelKcol('${ds}')">✕</button>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('ki-'+ds)?.focus(),30);
}
function submitKcol(ds){
  const txt=document.getElementById('ki-'+ds)?.value.trim();
  if(!txt){cancelKcol(ds);return;}
  const cat=document.getElementById('kc-'+ds)?.value||'other';
  const pri=Math.min(10,Math.max(1,parseInt(document.getElementById('kp-'+ds)?.value)||5));
  addTaskToDate(ds,txt,cat,pri,'');
}
function cancelKcol(ds){const area=document.getElementById('kcol-add-'+ds);if(area)area.innerHTML=`<button class="kcol-add-btn" onclick="showKcolAdd('${ds}')"><i class="ti ti-plus" style="font-size:11px"></i>Додати</button>`;}

/* RENDER */
function render(){
  document.getElementById('nav-label').textContent=formatNavLabel();
  renderQuick();
  const cv=document.getElementById('calendar-view');
  const ta=document.getElementById('tasks-area');
  document.getElementById('add-form-area').innerHTML='';

  if(view==='day'){
    cv.innerHTML='';
    const tasks=getTasksForDate(cursor).sort((a,b)=>b.pri-a.pri);
    setProgress(progressFor(tasks),'виконано');
    document.getElementById('add-form-area').innerHTML=`<div class="add-card glass2" style="margin-bottom:16px">
      <div class="sec-title"><i class="ti ti-plus" style="font-size:13px;color:var(--accent)"></i>Додати задачу</div>
      <div class="field-row"><input type="text" id="d-txt" placeholder="Назва задачі..." onkeydown="if(event.key==='Enter')submitDayAdd()"/></div>
      <div class="field-grid-day">
        <div><div class="field-lbl">Категорія</div>
          <select id="d-cat">
            <option value="best">💙 БЕСТ</option><option value="allm">💜 AllMasters</option>
            <option value="pers">🩷 Особисте</option><option value="study">🟠 Навчання</option>
            <option value="other">⚪ Інше</option>
          </select>
        </div>
        <div><div class="field-lbl">Пріоритет</div><input type="number" id="d-pri" min="1" max="10" value="5"/></div>
      </div>
      <div class="field-lbl">Нотатка</div>
      <textarea id="d-note" placeholder="Нотатка (необов'язково)..."></textarea>
      <button class="btn-add" onclick="submitDayAdd()"><i class="ti ti-plus"></i>Додати задачу</button>
    </div>`;
    ta.innerHTML=tasks.length?tasks.map(t=>taskCardHTML(t)).join(''):`<div class="empty-state"><i class="ti ti-checkbox"></i><p>Задач немає — додай першу!</p></div>`;
  }
  else if(view==='week'){
    const ws=getWeekStart(cursor);
    const dates=Array.from({length:7},(_,i)=>new Date(ws.getTime()+i*86400000));
    const td=todayD();
    setProgress(progressFor(dates.flatMap(d=>getTasksForDate(d))),'за тиждень');
    let html=`<div class="week-kanban">`;
    dates.forEach(d=>{
      const ds=dk(d);const tasks=getTasksForDate(d).sort((a,b)=>b.pri-a.pri);const isToday=dk(d)===dk(td);
      html+=`<div class="kanban-col glass${isToday?' is-today':''}" id="kcol-${ds}"
        ondragover="onColDragOver(event,'${ds}')" ondrop="onColDrop(event,'${ds}')"
        ondragleave="document.getElementById('kcol-${ds}').classList.remove('drop-target')">
        <div class="kanban-col-header"><div class="kcol-day">${DAYS[d.getDay()]}</div><div class="kcol-num">${d.getDate()}</div></div>
        ${tasks.length?tasks.map(t=>kanbanTaskHTML(t)).join(''):`<div class="empty-col">Перетягни або додай</div>`}
        <div id="kcol-add-${ds}"><button class="kcol-add-btn" onclick="showKcolAdd('${ds}')"><i class="ti ti-plus" style="font-size:11px"></i>Додати</button></div>
      </div>`;
    });
    cv.innerHTML=html+`</div>`;ta.innerHTML='';
  }
  else{
    const y=cursor.getFullYear(),m=cursor.getMonth();
    const firstDay=new Date(y,m,1),lastDay=new Date(y,m+1,0),startPad=(firstDay.getDay()+6)%7,td=todayD();
    let html=`<div class="month-cal-grid">`;
    ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].forEach(n=>html+=`<div class="mhdr">${n}</div>`);
    for(let i=0;i<startPad;i++){const pd=new Date(y,m,1-startPad+i);html+=`<div class="mday other-month"><div class="md-num">${pd.getDate()}</div></div>`;}
    for(let d=1;d<=lastDay.getDate();d++){const dd=new Date(y,m,d);const tasks=getTasksForDate(dd);const dots=tasks.slice(0,5).map(t=>`<div class="dot" style="background:${CAT[t.cat]?.color||'#888'}"></div>`).join('');html+=`<div class="mday${dk(dd)===dk(td)?' is-today':''}"><div class="md-num">${d}</div><div class="md-dots">${dots}</div></div>`;}
    const remain=(7-((startPad+lastDay.getDate())%7))%7;for(let i=1;i<=remain;i++)html+=`<div class="mday other-month"><div class="md-num">${i}</div></div>`;
    cv.innerHTML=html+`</div>`;
    const daysInMonth=Array.from({length:lastDay.getDate()},(_,i)=>new Date(y,m,i+1));
    setProgress(progressFor(daysInMonth.flatMap(d=>getTasksForDate(d))),'за місяць');
    ta.innerHTML=groupedHTML(daysInMonth);
  }
}

function submitDayAdd(){
  const txt=document.getElementById('d-txt')?.value.trim();if(!txt)return;
  const cat=document.getElementById('d-cat').value;
  const pri=Math.min(10,Math.max(1,parseInt(document.getElementById('d-pri').value)||5));
  const note=document.getElementById('d-note')?.value.trim()||'';
  addTaskToDate(dk(cursor),txt,cat,pri,note);
}

load();cursor=todayD();render();
</script>
</body>
</html>
